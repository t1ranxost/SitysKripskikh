<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База данных</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-right-controls">
    <button id="settings-btn" class="settings-btn">Настройки</button>
    <div id="settings-menu" class="settings-menu hidden">
      <div class="settings-title">Выберите фон</div>
      <button class="bg-btn" data-bg="0">Фон 1</button>
      <button class="bg-btn" data-bg="1">Фон 2</button>
      <button class="bg-btn" data-bg="2">Фон 3</button>
      <button class="bg-btn" data-bg="3">Фон 4</button>
      <button class="bg-btn" data-bg="4">Фон 5</button>
    </div>
  </div>

  <div class="main-wrapper">
    <div id="table-container">
      
      <div id="top-bar">
        <button id="btn-prev" class="nav-btn">&larr; Назад</button>
        <h1 id="page-title">Загрузка...</h1>
        <button id="btn-next" class="nav-btn">Вперед &rarr;</button>
      </div>

      <div id="content-area">
        <div id="loader">
          <div class="spinner"></div>
        </div>
      </div>

      <div id="bottom-indicator">
        <span id="page-indicator"></span>
      </div>

    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
